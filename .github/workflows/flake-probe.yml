# Temporary: repeats the three tests of #11, #12 and #13 on a CI runner, with the
# settings of ci.yml, to say whether CI reproduces them. Runs only when this
# file changes and is removed again before #10 is merged. It never fails the
# check on purpose: the counts are the result, and they stand in an annotation.
name: Flake probe

on:
  pull_request:
    paths:
      - .github/workflows/flake-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestChatTriageSurvivesARestart
            pkg: ./internal/integration/
          - test: TestHeartbeatSignatureAdvancesAfterASuccessfulRun
            pkg: ./internal/integration/
          - test: TestSyncNeverStoresLinkTargetUnderRace
            pkg: ./internal/homestore/
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: covey
          POSTGRES_PASSWORD: covey
          POSTGRES_DB: covey
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U covey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
      - name: postgres without fsync
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U covey -d covey
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
      - name: web/dist stub
        run: mkdir -p web/dist && echo '<!doctype html><title>ci</title>' > web/dist/index.html
      - name: repeat the test
        env:
          COVEY_TEST_DATABASE_URL: postgres://covey:covey@localhost:5433/covey?sslmode=disable
          COVEY_TEST_WAIT_FACTOR: "3"
          TEST: ${{ matrix.test }}
          PKG: ${{ matrix.pkg }}
        run: |
          go test -v -timeout 40m -count=40 -run "^${TEST}\$" "$PKG" 2>&1 | tee "$RUNNER_TEMP/probe.log" || true
          pass=$(grep -c -E "^--- PASS: ${TEST} " "$RUNNER_TEMP/probe.log" || true)
          fail=$(grep -c -E "^--- FAIL: ${TEST} " "$RUNNER_TEMP/probe.log" || true)
          lines=$(grep -E -A6 "^--- FAIL: ${TEST} " "$RUNNER_TEMP/probe.log" | head -c 2500 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')
          echo "::notice title=${TEST}::passed=${pass} failed=${fail} of 40 on $(go version | cut -d' ' -f3)%0A${lines}"
